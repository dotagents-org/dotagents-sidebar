<!doctype html>
<!-- The secondary sidebar around the view: the tab's title bar with its buttons, as VS Code draws it -->
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; font: 11px "Segoe UI", system-ui, sans-serif; }
.dark { --bg: #181818; --fg: #cccccc; --muted: #9d9d9d; --line: #2b2b2b; --red: #f14c4c; }
.light { --bg: #f8f8f8; --fg: #3b3b3b; --muted: #6e6e6e; --line: #e5e5e5; --red: #cd3131; }
.side { width: 1000px; height: 430px; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; border: 1px solid var(--line); box-sizing: border-box; }
.bar { height: 35px; flex: none; display: flex; align-items: center; padding: 0 8px 0 20px; gap: 4px; }
.bar .title { flex: 1; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.bar svg { width: 16px; height: 16px; padding: 3px; color: var(--fg); }
iframe { flex: 1; border: 0; width: 100%; }
</style>
</head>
<body>
<div class="side" id="side">
  <div class="bar">
    <span class="title">dotagents: Sidebar</span>
    <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    <svg viewBox="0 0 16 16"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    <svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1" stroke="currentColor" fill="none"/><path d="M8 3.5v9" stroke="currentColor"/></svg>
    <svg viewBox="0 0 16 16"><path d="M12.5 8a4.5 4.5 0 1 1-1.3-3.2M12.5 2.5v3h-3" stroke="#89d185" stroke-width="1.2" fill="none"/></svg>
    <svg viewBox="0 0 16 16"><path d="M6 2.5h4M2.5 4h11M4 4l.7 9.1a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9L12 4" stroke="var(--red)" fill="none" stroke-linecap="round"/></svg>
  </div>
  <iframe id="view"></iframe>
</div>
<script>
const theme = location.hash.slice(1) || "dark";
document.getElementById("side").className = `side ${theme}`;
document.getElementById("view").src = `view.html#${theme}`;
</script>
</body>
</html>
