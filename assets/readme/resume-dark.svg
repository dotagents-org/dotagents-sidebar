<svg xmlns="http://www.w3.org/2000/svg" width="980" height="130" viewBox="0 0 980 130" role="img" aria-label="Back to the right conversation: the agent's SessionStart hook tells which conversation it is in, and a restart resumes that one" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g filter="url(#shadow)"><rect x="0" y="10" width="215" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="16" y="42" font-size="14" font-weight="700" fill="#ededed">a session starts</text><text x="16" y="61" font-size="12" fill="#a0a0a0">Claude Code or</text><text x="16" y="80" font-size="12" fill="#a0a0a0">Codex, with a hook</text><text x="16" y="99" font-size="12" fill="#a0a0a0">on its command line</text><g filter="url(#shadow)"><rect x="255" y="10" width="215" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="271" y="42" font-size="14" font-weight="700" fill="#ededed">SessionStart</text><text x="271" y="61" font-size="12" fill="#a0a0a0">the agent tells the</text><text x="271" y="80" font-size="12" fill="#a0a0a0">conversation it is in,</text><text x="271" y="99" font-size="12" fill="#a0a0a0">also after /clear</text><path d="M215 65L251 65" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><g filter="url(#shadow)"><rect x="510" y="10" width="215" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="526" y="42" font-size="14" font-weight="700" fill="#ededed">a file per session</text><text x="526" y="61" font-size="12" fill="#a0a0a0">the hook writes the</text><text x="526" y="80" font-size="12" fill="#a0a0a0">conversation's id, the</text><text x="526" y="99" font-size="12" fill="#a0a0a0">extension reads it</text><path d="M470 65L506 65" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><g filter="url(#shadow)"><rect x="765" y="10" width="215" height="110" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="765" y="22" width="3" height="86" rx="1.5" fill="#e39478"/><text x="781" y="42" font-size="14" font-weight="700" fill="#ededed">a restart</text><text x="781" y="61" font-size="12" fill="#a0a0a0">claude --resume &lt;id&gt;,</text><text x="781" y="80" font-size="12" fill="#a0a0a0">codex resume &lt;id&gt;:</text><text x="781" y="99" font-size="12" fill="#a0a0a0">the same conversation</text><path d="M725 65L761 65" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/>
</svg>
