<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-label="How it works: the webview and the extension run in the VS Code window; the agents run in a detached host process, and the accounts come from dotagents start" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Consolas, monospace">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/></filter>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="420" height="300" rx="16" fill="#0a0a0a" stroke="#2b2b2b" stroke-dasharray="4 4"/><text x="16" y="22" font-size="11" letter-spacing="1" fill="#a0a0a0">THE VS CODE WINDOW</text><g filter="url(#shadow)"><rect x="20" y="40" width="380" height="100" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="36" y="76" font-size="14" font-weight="700" fill="#ededed">the view, a webview</text><text x="36" y="95" font-size="12" fill="#a0a0a0">a terminal per session (xterm.js),</text><text x="36" y="114" font-size="12" fill="#a0a0a0">the session list, the accounts tab</text><g filter="url(#shadow)"><rect x="20" y="180" width="380" height="100" rx="12" fill="#111111" stroke="#2b2b2b"/></g><text x="36" y="216" font-size="14" font-weight="700" fill="#ededed">the extension</text><text x="36" y="235" font-size="12" fill="#a0a0a0">sessions, commands, the status bar;</text><text x="36" y="254" font-size="12" fill="#a0a0a0">connects to the host and to dotagents</text><path d="M180 140L180 176" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><path d="M240 176L240 144" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="252" y="163" font-size="11" text-anchor="start" fill="#a0a0a0">messages</text><g filter="url(#shadow)"><rect x="580" y="20" width="400" height="120" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="580" y="32" width="3" height="96" rx="1.5" fill="#e39478"/><text x="596" y="57" font-size="14" font-weight="700" fill="#ededed">host.js, detached</text><text x="596" y="76" font-size="12" fill="#a0a0a0">one per workspace: Claude Code, Codex</text><text x="596" y="95" font-size="12" fill="#a0a0a0">and terminals on node-pty, with a copy</text><text x="596" y="114" font-size="12" fill="#a0a0a0">of each screen; it outlives a reload</text><g filter="url(#shadow)"><rect x="580" y="170" width="400" height="120" rx="12" fill="#111111" stroke="#2b2b2b"/></g><rect x="580" y="182" width="3" height="96" rx="1.5" fill="#6fa3b8"/><text x="596" y="207" font-size="14" font-weight="700" fill="#ededed">dotagents start</text><text x="596" y="226" font-size="12" fill="#a0a0a0">the accounts' local API on 127.0.0.1,</text><text x="596" y="245" font-size="12" fill="#a0a0a0">with a token; the extension starts it</text><text x="596" y="264" font-size="12" fill="#a0a0a0">when none answers</text><path d="M400 210C488 210 488 80 576 80" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="566" y="64" font-size="11" text-anchor="end" fill="#a0a0a0">a private socket</text><path d="M400 250C488 250 488 230 576 230" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#head)"/><text x="488" y="222" font-size="11" text-anchor="middle" fill="#a0a0a0">HTTP, live events</text>
</svg>
